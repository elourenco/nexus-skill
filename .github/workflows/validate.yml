name: Validate foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate skill and local references
        run: python3 scripts/validate.py
      - name: Test local memory persistence and recovery
        run: python3 -m unittest discover -s tests -v
