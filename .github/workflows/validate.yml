name: Validate foundation

on:
  push:
    branches-ignore: [main, master]
    tags-ignore: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate skill and local references
        run: python3 scripts/validate.py
      - name: Test optional text runtime with local HTTP fixtures
        run: python3 -m unittest discover -s runtime/tests -v
      - name: Validate optional hook registry
        run: python3 skills/nexus/scripts/hook_engine.py validate
      - name: Test local memory, workflows and hooks
        run: python3 -m unittest discover -s tests -v
